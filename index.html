<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eventi R/S</title>
<meta name="description" content="Gli eventi di BuonaCaccia per rover e scolte: ROSS, EPPPI, eventi partenti e altro.">
<meta property="og:title" content="Eventi R/S">
<meta property="og:description" content="ROSS, EPPPI, eventi partenti e gli altri eventi per rover e scolte, presi da BuonaCaccia.">
<meta property="og:image" content="https://eventi-rs.mattialarosa.com/icona/icona-512.png">
<meta name="theme-color" content="#C4122F" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1722" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/svg+xml" href="icona/icona.svg">
<link rel="icon" type="image/png" href="icona/icona-512.png">
<link rel="apple-touch-icon" href="icona/icona-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Hallmark · shape: app screen · genre: atmospheric · theme: Ribbon (by request) · redesign: full
 * nav: testata con nome, frase e pulsante Telegram · signature: il pannello dei filtri lavorato come un'apparecchiatura, sopra l'elenco a righe sottili con lo stato a pallino · states: caricamento, vuoto, errore, pieno · ribbon: dawn, e nel tema scuro una notte azzurro camicia
 * brand: rosso della branca R/S al posto del verde acqua, azzurro camicia AGESCI nel tema scuro, verde/giallo/arancio per lo stato delle iscrizioni (richiesta dell'utente)
 * axes: light/grotesk-sans/neutral · posture: restrained · contrast: pass · v2.0.0 */
/* Hallmark · pre-emit critique: P3 H5 E4 S4 R4 V4 · weakest: P, uno strumento di consultazione non ha una tesi; la voce sta nei titoli leggeri, nel pannello lavorato e nello stato leggibile a colpo d'occhio */
/* Hallmark · dismissed F4 · il chip del tipo selezionato è lo stato di un filtro su una tinta chiara, non un secondo pulsante principale accanto a Telegram */
:root {
  color-scheme: light;
  --space-2xs: 4px; --space-xs: 8px; --space-sm: 12px; --space-md: 16px; --space-lg: 24px; --space-xl: 40px; --space-2xl: 64px;
  --text-sm: 0.875rem; --text-md: 1rem; --text-lg: 1.2rem; --text-xl: 1.44rem; --text-2xl: 1.728rem; --text-3xl: 2.074rem;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1); --dur-short: 220ms;
  --container: 800px;
  --color-paper: oklch(98.2% 0.008 82); --color-paper-2: oklch(95.8% 0.011 82); --color-paper-3: oklch(92.3% 0.014 82);
  --color-ink: oklch(18% 0.006 80); --color-ink-2: oklch(30% 0.008 80); --color-muted: oklch(47% 0.012 80);
  --color-rule: oklch(89.5% 0.011 82);
  /* Il rosso della branca R/S prende il posto del verde acqua del tema */
  --color-accent: #C4122F; --color-accent-deep: #A10E26; --color-accent-ink: #FFF7F8; --color-accent-soft: #F6DDE1;
  --color-focus: #C4122F;
  /* Stato delle iscrizioni */
  --stato-aperte: #1F7A4A; --stato-pochi: #946006; --stato-sovra: #B9470F; --stato-chiuse: #646F68;
  --edge-light: inset 0 1px 0 oklch(100% 0 0 / 0.5);
  --edge-lit: inset 0 1px 0 oklch(100% 0 0 / 0.25);
  --shadow-part: 0 1px 0 oklch(20% 0.01 80 / 0.25), 0 10px 18px -6px oklch(20% 0.01 80 / 0.3);
  --shadow-panel: 0 1px 0 oklch(20% 0.01 80 / 0.2), 0 24px 48px -16px oklch(20% 0.02 80 / 0.35);
  --font-display: "Instrument Sans", ui-sans-serif, system-ui, sans-serif; --font-body: "Figtree", ui-sans-serif, system-ui, sans-serif;
  --radius-card: 20px; --radius-part: 6px; --radius-pill: 999px; --rule-hair: 1px;
  --tracking-display: -0.035em; --display-weight: 400;
}
/* Tema scuro: la notte nell'azzurro della camicia AGESCI, ombre dal nero */
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --color-paper: #0F1722; --color-paper-2: #172231; --color-paper-3: #1E2A3B;
    --color-ink: #E4ECF5; --color-ink-2: #CBD6E3; --color-muted: #9BAABD;
    --color-rule: #2A384A;
    --color-accent: #FF5C70; --color-accent-deep: #FF8594; --color-accent-ink: #22090E; --color-accent-soft: #3B1A21;
    --color-focus: #FF5C70;
    --stato-aperte: #52C48A; --stato-pochi: #E4AE48; --stato-sovra: #F2884A; --stato-chiuse: #8693A5;
    --edge-light: inset 0 1px 0 oklch(100% 0 0 / 0.07);
    --edge-lit: inset 0 1px 0 oklch(100% 0 0 / 0.3);
    --shadow-part: 0 1px 0 oklch(0% 0 0 / 0.5), 0 10px 18px -6px oklch(0% 0 0 / 0.6);
    --shadow-panel: 0 1px 0 oklch(0% 0 0 / 0.4), 0 24px 48px -16px oklch(0% 0 0 / 0.7);
  }
}
*, *::before, *::after { box-sizing: border-box; }
html, body { overflow-x: clip; }
html { scrollbar-color: var(--color-muted) var(--color-paper); }
body {
  margin: 0; background: var(--color-paper); color: var(--color-ink-2);
  font-family: var(--font-body); font-size: var(--text-md); line-height: 1.6;
  -webkit-font-smoothing: antialiased; caret-color: var(--color-accent);
}
::selection { background: color-mix(in oklab, var(--color-accent) 22%, transparent); }
:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
h1, h2, h3 {
  margin: 0; color: var(--color-ink); font-family: var(--font-display); font-weight: var(--display-weight);
  font-synthesis: none; letter-spacing: var(--tracking-display); line-height: 1.08;
  overflow-wrap: break-word; min-width: 0;
}
h1, h2 { text-wrap: balance; }
p { margin: 0; text-wrap: pretty; }
button, input, select { font: inherit; }
.nascosto { display: none !important; }

main { width: 100%; max-width: var(--container); margin-inline: auto; padding: var(--space-xl) var(--space-md) var(--space-2xl); }

/* Testata */
.testata { display: grid; gap: var(--space-sm); padding-bottom: var(--space-lg); }
.marchio { display: flex; align-items: center; gap: var(--space-sm); }
.icona { flex: none; width: 48px; height: 48px; border-radius: 10px; }
h1 { font-size: var(--text-3xl); }
.intro { color: var(--color-muted); max-width: 54ch; }
.btn {
  justify-self: start; display: inline-flex; align-items: center; gap: var(--space-xs);
  min-height: 44px; padding: 0 var(--space-lg); margin-top: var(--space-2xs);
  border: var(--rule-hair) solid var(--color-accent); border-radius: var(--radius-pill);
  background: var(--color-accent); color: var(--color-accent-ink); box-shadow: var(--edge-lit), var(--shadow-part);
  font-size: var(--text-sm); font-weight: 500; white-space: nowrap; text-decoration: none; cursor: pointer;
  transition: background-color var(--dur-short) var(--ease-out), border-color var(--dur-short) var(--ease-out);
}
.btn:hover { background: var(--color-accent-deep); border-color: var(--color-accent-deep); }
.btn:active { transform: translateY(1px); }

/* Filtri: un pannello lavorato, illuminato dall'alto */
.filtri {
  display: grid; gap: var(--space-sm); padding: var(--space-lg); margin-bottom: var(--space-xs);
  border-radius: var(--radius-card); background: linear-gradient(var(--color-paper-2), var(--color-paper-3));
  box-shadow: var(--edge-light), var(--shadow-panel);
}
.campi { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--space-sm); }
input[type=search], select {
  width: 100%; min-height: 40px; padding: 0 var(--space-md); color: var(--color-ink); background: var(--color-paper);
  border: var(--rule-hair) solid var(--color-muted); border-radius: var(--radius-pill);
}
input[type=search]::placeholder { color: var(--color-muted); }
input:disabled, select:disabled, button:disabled { opacity: 0.55; cursor: not-allowed; }
.tipi { display: flex; flex-wrap: wrap; gap: var(--space-xs); }
.tipi button {
  min-height: 34px; padding: 0 var(--space-md); cursor: pointer;
  font-size: var(--text-sm); font-weight: 500; color: var(--color-ink);
  border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-pill);
  background: linear-gradient(var(--color-paper), var(--color-paper-2)); box-shadow: var(--edge-light), var(--shadow-part);
  transition: background-color var(--dur-short) var(--ease-out), border-color var(--dur-short) var(--ease-out);
}
.tipi button:hover { border-color: var(--color-muted); }
.tipi button:active { transform: translateY(1px); }
.tipi button[aria-pressed=true] { background: var(--color-accent-soft); border-color: var(--color-accent); box-shadow: var(--edge-light); }
.spunte { display: flex; flex-wrap: wrap; gap: var(--space-2xs) var(--space-lg); font-size: var(--text-sm); }
.spunte label { display: inline-flex; align-items: center; gap: var(--space-xs); min-height: 32px; cursor: pointer; }
.spunte input { accent-color: var(--color-accent); width: 18px; height: 18px; margin: 0; }
@media (pointer: coarse) {
  .tipi button, .spunte label, input[type=search], select { min-height: 44px; }
}
.conta { font-size: var(--text-sm); color: var(--color-muted); margin: var(--space-md) 0 0; }

/* Elenco: righe sottili, niente riquadri */
.mese {
  display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-md);
  margin-top: var(--space-xl); padding-bottom: var(--space-xs); border-bottom: var(--rule-hair) solid var(--color-ink);
}
.mese h2 { font-size: var(--text-2xl); text-transform: capitalize; }
.mese span { flex: none; font-size: var(--text-sm); color: var(--color-muted); font-variant-numeric: tabular-nums; }
ul.lista { list-style: none; margin: 0; padding: 0; }
.ev + .ev { border-top: var(--rule-hair) solid var(--color-rule); }
.ev a {
  display: grid; grid-template-columns: 5.5rem minmax(0, 1fr); gap: var(--space-md);
  padding: var(--space-md) 0; color: inherit; text-decoration: none;
}
.ev a:hover .titolo { text-decoration: underline; text-decoration-color: var(--color-accent); text-decoration-thickness: 2px; text-underline-offset: 0.16em; }
.giorni {
  display: block; font-size: var(--text-xl); font-weight: 500; line-height: 1.1; color: var(--color-ink);
  font-variant-numeric: lining-nums tabular-nums; white-space: nowrap;
}
.mesi { display: block; font-size: var(--text-sm); color: var(--color-muted); margin-top: var(--space-2xs); }
.ev[data-s=light_red] .giorni, .ev[data-s=''] .giorni { color: var(--stato-chiuse); }
.riga1 { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-xs) var(--space-sm); }
.tipo {
  font-size: var(--text-sm); font-weight: 700; line-height: 1.5; padding: 0 var(--space-xs);
  color: var(--color-accent); background: var(--color-accent-soft); border-radius: var(--radius-part);
}
/* Il pallino porta lo stato delle iscrizioni, con il suo colore */
.stato { display: inline-flex; align-items: center; gap: var(--space-xs); font-size: var(--text-sm); font-weight: 500; }
.stato::before { content: ''; flex: none; width: 10px; height: 10px; border-radius: 50%; background: currentColor; }
.ev[data-s=light_green] .stato { color: var(--stato-aperte); }
.ev[data-s=light_yellow] .stato { color: var(--stato-pochi); }
.ev[data-s=light_dual] .stato { color: var(--stato-sovra); }
.ev[data-s=light_red] .stato, .ev[data-s=''] .stato { color: var(--stato-chiuse); }
.titolo { margin: var(--space-xs) 0 var(--space-2xs); font-size: var(--text-lg); font-weight: 500; line-height: 1.25; letter-spacing: -0.01em; text-wrap: pretty; }
.meta { margin: 0; font-size: var(--text-sm); color: var(--color-muted); display: flex; flex-wrap: wrap; gap: 0 var(--space-md); }

.messaggio {
  margin-top: var(--space-lg); padding: var(--space-lg); color: var(--color-muted);
  border-radius: var(--radius-card); background: linear-gradient(var(--color-paper-2), var(--color-paper-3)); box-shadow: var(--edge-light);
}
.messaggio.errore { background: var(--color-accent-soft); color: var(--color-ink); }
footer { margin-top: var(--space-xl); padding-top: var(--space-sm); border-top: var(--rule-hair) solid var(--color-rule); font-size: var(--text-sm); color: var(--color-muted); }
footer a { color: var(--color-ink); text-underline-offset: 0.16em; }
footer a:hover { text-decoration-color: var(--color-accent); }

@media (max-width: 32rem) {
  main { padding-top: var(--space-lg); }
  .filtri { padding: var(--space-md); }
  .campi { grid-template-columns: minmax(0, 1fr); }
  .ev a { grid-template-columns: 4.5rem minmax(0, 1fr); gap: var(--space-sm); }
  .giorni { font-size: var(--text-lg); }
}
@media (prefers-reduced-motion: no-preference) {
  .lista.appena { animation: entra var(--dur-short) var(--ease-out); }
  @keyframes entra { from { opacity: 0; transform: translateY(6px); } }
}
@media (prefers-reduced-motion: reduce) {
  .btn, .tipi button { transition: none; }
  .btn:active, .tipi button:active { transform: none; }
}
</style>
</head>
<body>
<main>
  <header class="testata">
    <div class="marchio">
      <img class="icona" src="icona/icona.svg" alt="" width="48" height="48">
      <h1>Eventi R/S</h1>
    </div>
    <p class="intro">ROSS, EPPPI, eventi partenti e gli altri eventi per rover e scolte presi da BuonaCaccia. Prima di iscriverti parlane con i tuoi capi.</p>
    <a id="canale" class="btn canale nascosto" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3a6 6 0 0 0-6 6v3.6L4.3 15.4A1 1 0 0 0 5.2 17h13.6a1 1 0 0 0 .9-1.6L18 12.6V9a6 6 0 0 0-6-6Zm-2.4 15.5a2.5 2.5 0 0 0 4.8 0Z" fill="currentColor"/></svg>
      Ricevi le novità su Telegram
    </a>
  </header>

  <section class="filtri" aria-label="Filtri">
    <div class="campi">
      <input type="search" id="cerca" placeholder="Cerca per titolo o località" aria-label="Cerca">
      <select id="regione" aria-label="Regione"><option value="">Tutte le regioni</option></select>
    </div>
    <div class="tipi" id="tipi" role="group" aria-label="Tipo di evento"></div>
    <div class="spunte">
      <label><input type="checkbox" id="aperti"> Solo con iscrizioni aperte</label>
      <label id="rigaNaz" class="nascosto"><input type="checkbox" id="nazionali" checked> Includi gli eventi nazionali</label>
    </div>
  </section>

  <p class="conta" id="conta" aria-live="polite"></p>
  <div id="elenco"><div class="messaggio">Carico gli eventi da BuonaCaccia…</div></div>

  <footer id="piede"></footer>
</main>

<script>
// Link /exec del deployment Apps Script (Codice.gs)
const API = 'https://script.google.com/macros/s/AKfycbw0v94DTvL7-HQRP-IWfaMVDOKEiBb0giXtCRo_N-qj3ucjc_N4kfpRPGrE998WggMs/exec';

const DATI = { regione: new URLSearchParams(location.search).get('regione') || '' };
const LINK = 'https://buonacaccia.agesci.it/Event.aspx?e=';
const STATI = {
  light_green: 'Iscrizioni aperte',
  light_yellow: 'Pochi posti',
  light_dual: 'Forte sovrannumero',
  light_red: 'Chiuse o non ancora aperte',
};
const NOMI_TIPO = { Part: 'Partenti', AltroRS: 'Altro' };
const MESI = ['gennaio', 'febbraio', 'marzo', 'aprile', 'maggio', 'giugno', 'luglio', 'agosto', 'settembre', 'ottobre', 'novembre', 'dicembre'];
const MESI_BREVI = ['gen', 'feb', 'mar', 'apr', 'mag', 'giu', 'lug', 'ago', 'set', 'ott', 'nov', 'dic'];
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nomeTipo = t => NOMI_TIPO[t] || t;

let eventi = [];
const tipiScelti = new Set();


// Preferenze ricordate sul dispositivo; il link con ?regione=... ha la precedenza
let pref = {};
try { pref = JSON.parse(localStorage.getItem('eventiRS') || '{}'); } catch (e) {}
function salvaPref() {
  try {
    localStorage.setItem('eventiRS', JSON.stringify({
      regione: $('regione').value, aperti: $('aperti').checked, nazionali: $('nazionali').checked,
    }));
  } catch (e) {}
}

function mostraErrore(testo) {
  $('elenco').innerHTML = `<div class="messaggio errore">${esc(testo)}</div>`;
}

fetch(API)
  .then(r => {
    if (!r.ok) throw new Error();
    return r.json();
  })
  .then(r => {
    if (r.canale) {
      $('canale').href = r.canale;
      $('canale').classList.remove('nascosto');
    }
    if (r.errore) return mostraErrore(r.errore);
    avvia(r);
  })
  .catch(() => mostraErrore('Non riesco a caricare gli eventi. Controlla la connessione e ricarica la pagina.'));

function avvia(r) {
  eventi = r.eventi;

  const regioni = [...new Set(eventi.map(e => e.regione).filter(Boolean))]
    .sort((a, b) => (a === 'Nazionale') - (b === 'Nazionale') || a.localeCompare(b, 'it'));
  $('regione').insertAdjacentHTML('beforeend', regioni.map(x => `<option>${esc(x)}</option>`).join(''));

  const voluta = (DATI.regione || pref.regione || '').toLowerCase();
  const trovata = regioni.find(x => x.toLowerCase() === voluta);
  if (trovata) $('regione').value = trovata;
  if (typeof pref.aperti === 'boolean') $('aperti').checked = pref.aperti;
  if (typeof pref.nazionali === 'boolean') $('nazionali').checked = pref.nazionali;

  const tipi = [...new Set(eventi.map(e => e.tipo).filter(Boolean))];
  $('tipi').innerHTML = tipi.map(t => `<button type="button" aria-pressed="false" data-t="${esc(t)}">${esc(nomeTipo(t))}</button>`).join('');

  const ora = new Date(r.aggiornato);
  $('piede').innerHTML = `Dati da <a href="https://buonacaccia.agesci.it/Events.aspx" target="_blank" rel="noopener">BuonaCaccia</a>, letti alle ${ora.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' })}. Per i dettagli e l'iscrizione fa fede la pagina dell'evento.`;

  render(true);
}

function data(s) {
  const [g, m, a] = s.split('/').map(Number);
  return new Date(a, m - 1, g);
}
const due = n => String(n).padStart(2, '0');

function periodo(e) {
  if (!e.dal) return { giorni: '?', mesi: '' };
  const a = data(e.dal);
  const b = e.al ? data(e.al) : a;
  if (+a === +b) return { giorni: due(a.getDate()), mesi: MESI_BREVI[a.getMonth()] };
  const mesi = a.getMonth() === b.getMonth()
    ? MESI_BREVI[a.getMonth()]
    : `${MESI_BREVI[a.getMonth()]}–${MESI_BREVI[b.getMonth()]}`;
  return { giorni: `${due(a.getDate())}–${due(b.getDate())}`, mesi };
}

function posti(e) {
  if (e.iscritti == null) return '';
  if (e.posti == null) return `${e.iscritti} iscritti`;
  return `${e.iscritti} iscritti su ${e.posti} posti`;
}

// Date delle iscrizioni: arrivano solo se il bot le ha già lette dalla pagina dell'evento
function iscrizioni(e) {
  const breve = d => d.slice(0, 5);
  if (e.apre && e.chiude) return `Iscrizioni dal ${breve(e.apre)} al ${breve(e.chiude)}`;
  if (e.apre) return `Iscrizioni dal ${breve(e.apre)}`;
  if (e.chiude) return `Iscrizioni fino al ${breve(e.chiude)}`;
  return '';
}

function render(primaVolta) {
  const q = $('cerca').value.trim().toLowerCase();
  const reg = $('regione').value;
  const naz = $('nazionali').checked;
  const soloAperti = $('aperti').checked;
  $('rigaNaz').classList.toggle('nascosto', !reg || reg === 'Nazionale');

  const visibili = eventi.filter(e => {
    if (tipiScelti.size && !tipiScelti.has(e.tipo)) return false;
    if (soloAperti && !['light_green', 'light_yellow', 'light_dual'].includes(e.stato)) return false;
    if (reg && e.regione !== reg && !(naz && e.regione === 'Nazionale')) return false;
    if (q && !`${e.titolo} ${e.luogo} ${e.regione} ${e.tipo}`.toLowerCase().includes(q)) return false;
    return true;
  });

  $('conta').textContent = `${visibili.length} ${visibili.length === 1 ? 'evento' : 'eventi'}`;

  if (!visibili.length) {
    $('elenco').innerHTML = '<div class="messaggio">Nessun evento con questi filtri. Prova a togliere qualche tipo o a scegliere tutte le regioni.</div>';
    return;
  }

  const gruppi = [];
  visibili.forEach(e => {
    const d = e.dal ? data(e.dal) : null;
    const chiave = d ? `${MESI[d.getMonth()]} ${d.getFullYear()}` : 'Senza data';
    let g = gruppi[gruppi.length - 1];
    if (!g || g.chiave !== chiave) gruppi.push(g = { chiave, eventi: [] });
    g.eventi.push(e);
  });

  $('elenco').innerHTML = gruppi.map(g => `
    <div class="mese"><h2>${esc(g.chiave)}</h2><span>${g.eventi.length} ${g.eventi.length === 1 ? 'evento' : 'eventi'}</span></div>
    <ul class="lista${primaVolta ? ' appena' : ''}">${g.eventi.map(e => {
      const p = periodo(e);
      const luogo = [e.luogo, e.regione].filter(Boolean).join(', ');
      const meta = [luogo, e.quota, posti(e), iscrizioni(e)].filter(Boolean).map(x => `<span>${esc(x)}</span>`).join('');
      return `<li class="ev" data-s="${esc(e.stato)}">
        <a href="${LINK}${encodeURIComponent(e.id)}" target="_blank" rel="noopener">
          <div class="quando"><span class="giorni">${esc(p.giorni)}</span><span class="mesi">${esc(p.mesi)}</span></div>
          <div>
            <div class="riga1"><span class="tipo">${esc(nomeTipo(e.tipo))}</span><span class="stato">${esc(STATI[e.stato] || 'Stato non indicato')}</span></div>
            <h3 class="titolo">${esc(e.titolo)}</h3>
            <p class="meta">${meta}</p>
          </div>
        </a>
      </li>`;
    }).join('')}</ul>`).join('');
}

$('tipi').addEventListener('click', ev => {
  const b = ev.target.closest('button');
  if (!b) return;
  const t = b.dataset.t;
  tipiScelti.has(t) ? tipiScelti.delete(t) : tipiScelti.add(t);
  b.setAttribute('aria-pressed', tipiScelti.has(t));
  render();
});
$('cerca').addEventListener('input', () => render());
['regione', 'aperti', 'nazionali'].forEach(id => $(id).addEventListener('change', () => { salvaPref(); render(); }));
</script>
</body>
</html>
